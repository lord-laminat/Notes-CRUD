name: CI pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        run: |
          mkdir reports
      
      - name: Build and run containers
        env:
          POSTGRES_USER: ${{ secrets.DB_USER }}
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
          POSTGRES_DB: ${{ secrets.DB_NAME }}
          SECRET_KEY: ${{ secrets.APP_SECRET }}
        run: |
          docker compose up --build -d > reports/docker-build.report
          docker compose ps > reports/docker-compose.report

      - name: Test backend and db
        env:
          POSTGRES_USER: ${{ secrets.DB_USER }}
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
          POSTGRES_DB: ${{ secrets.DB_NAME }}
          APP_PORT: ${{ secrets.APP_PORT }}
        run: |
          curl -X POST -H "Content-Type: application/json" -d '{"username": "example", "email": "example@gmail.com", "password": "example"}' http://localhost:{{ secrets.APP_PORT }}/register > reports/curl.report
          echo "Attempt 2:" >> reports/curl.report
          curl -X POST -H "Content-Type: application/json" -d '{"username": "example", "email": "example@gmail.com", "password": "example"}' http://localhost:$APP_PORT/register >> reports/curl.report
          psql -U $DB_USER -d $POSTGRES_DB -h localhost -c "SELECT * FROM users;" > reports/psql.report

      - name: Upload reports
        uses: actions/upload-artifact@v3
        with:
          name: test-reports
          path: reports/
          retention-days: 7

  deploy_docker_images_to_hub:
    runs-on: ubuntu-latest
    needs: build_and_test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.frontend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/notes-crud-frontend:latest

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.backend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/notes-crud-backend:latest

  
